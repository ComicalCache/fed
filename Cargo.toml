[package]
name = "fed"
version = "3.8.1"
edition = { workspace = true }

[workspace]
resolver = "3"
members = ["piece-table"]

[workspace.package]
edition = "2024"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_panics_doc = "allow"

[profile.release]
strip = "symbols"
codegen-units = 1
lto = "fat"

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
crossterm = {
    version = "0.29.0",
    default-features = false,
    features = ["bracketed-paste", "event-stream"]
}
fancy-regex = "0.18.0"
futures = "0.3.32"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
libc = "0.2.190"
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "std", "clock"] }
tokio = { version = "1.52.3", features = ["full"] }
anstyle-parse = "1.0.0"

piece-table = { path = "piece-table" }
