[package]
name = "fed"
version = "2.4.0"
edition = { workspace = true }

[workspace]
resolver = "3"
members = ["piece-table"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
tokio = { version = "1.52.3", features = ["full"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[profile.release]
strip = "symbols"
codegen-units = 1
lto = "fat"

[dependencies]
arboard = "3.6.1"
crossterm = {
    version = "0.29.0",
    default-features = false,
    features = ["bracketed-paste", "event-stream"]
}
fancy-regex = "0.18.0"
futures = "0.3.32"
rust-lapper = "1.3.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

tokio = { workspace = true }

piece-table = { path = "piece-table" }
