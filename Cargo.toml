[package]
name = "fed"
version = "3.18.0"
edition = "2024"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_panics_doc = "allow"

[profile.release]
strip = "symbols"
codegen-units = 1
lto = "fat"

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
crossterm = {
    version = "0.29.0",
    default-features = false,
    features = ["bracketed-paste", "event-stream"]
}
fancy-regex = "0.20.2"
futures = "0.3.34"
ignore = "0.4.34"
nucleo-matcher = "0.3.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
libc = "0.2.191"
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "std", "clock"] }
tokio = { version = "1.54.1", features = ["full"] }
anstyle-parse = "1.0.0"
